<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>L³ INTEGRA</title>
<link rel="icon" href="../assets/img/marca/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="integra.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<section class="login" id="tela-login" hidden>
  <div class="login-marca">
    <img src="../assets/img/marca/LTS-LOGO-HOR-BRANCO_REV01.svg" alt="LIPPMANN Treinamentos e Soluções" width="230" height="18">
    <div>
      <div class="selo">L<sup>3</sup> INTEGRA</div>
      <p style="margin-top:18px">Painel gerencial da LIPPMANN: leads, newsletter, contatos, banco de talentos, agenda e indicadores do site em um só lugar.</p>
    </div>
    <p style="font-size:.8rem;color:var(--azul-nevoa)">Área restrita à equipe LIPPMANN. Acessos são registrados.</p>
  </div>
  <div class="login-form">
    <form id="form-login" novalidate>
      <div><h1>Entrar</h1></div>
      <p class="sub">Use o usuário e a senha do seu perfil.</p>
      <div class="campo"><label for="lg-usuario">Usuário</label><input id="lg-usuario" name="usuario" autocomplete="username" required></div>
      <div class="campo"><label for="lg-senha">Senha</label><input id="lg-senha" name="senha" type="password" autocomplete="current-password" required></div>
      <p class="aviso erro" id="lg-erro" role="alert" hidden></p>
      <button class="btn btn-primario btn-grande" type="submit">Acessar o painel</button>
      <p id="lg-demo" class="aviso atencao" hidden></p>
      <a href="../index.html" style="font-size:.84rem">← Voltar ao site</a>
    </form>
  </div>
</section>

<!-- ================= PAINEL ================= -->
<div class="app" id="tela-app" hidden>
  <aside class="lateral" id="lateral">
    <div class="marca"><b>L<sup>3</sup> INTEGRA</b><span>LIPPMANN</span></div>
    <nav class="menu" id="menu" aria-label="Seções do painel"></nav>
    <div class="pe">
      <div><b id="pe-nome"></b><span class="perfil" id="pe-perfil"></span></div>
      <a href="../index.html" target="_blank" rel="noopener">Abrir o site</a>
      <button type="button" id="bt-sair">Sair</button>
    </div>
  </aside>
  <main class="principal" id="principal">
    <div class="topo">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="btn btn-sec menu-movel" type="button" id="bt-menu" aria-label="Abrir menu">☰</button>
        <div><h1 id="titulo-secao"></h1><p id="sub-secao"></p></div>
      </div>
      <div class="acoes" id="acoes-topo"></div>
    </div>
    <div class="faixa-demo" id="faixa-demo" hidden></div>
    <div id="conteudo"></div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../data/treinamentos.js"></script>
<script src="../data/solucoes.js"></script>
<script src="../data/conteudos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
